<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Benchmark 10 Elements</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div style="padding: 24px; max-width: 600px; margin: 0 auto;">
    <h2>Benchmark: 10 Controls</h2>
    <form id="bench-10-form">
      <div><input type="text" id="user-name" placeholder="User Name"></div>
      <div><input type="email" id="user-email" placeholder="Email"></div>
      <div><input type="checkbox" id="newsletter-opt" checked> <label for="newsletter-opt">Newsletter</label></div>
      <div><input type="checkbox" id="promo-notifications"> <label for="promo-notifications">Promotions</label></div>
      <div><select id="report-format"><option value="PDF">PDF</option><option value="CSV">CSV</option></select></div>
      <div><input type="text" id="phone-number" placeholder="Phone"></div>
      <div><input type="checkbox" id="sms-alerts"> <label for="sms-alerts">SMS Alerts</label></div>
      <div><select id="country-select"><option value="US">US</option><option value="IN">IN</option></select></div>
      <div><button type="button" id="cancel-btn">Cancel</button></div>
      <div><button type="submit" id="save-settings-btn">Save Changes</button></div>
    </form>
  </div>
</body>
</html>

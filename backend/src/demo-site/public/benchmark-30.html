<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Benchmark 30 Elements</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div style="padding: 24px; max-width: 800px; margin: 0 auto;">
    <h2>Benchmark: 30 Controls</h2>
    <form id="bench-30-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div><input type="text" id="input-1" placeholder="Field 1"></div>
      <div><input type="text" id="input-2" placeholder="Field 2"></div>
      <div><input type="text" id="input-3" placeholder="Field 3"></div>
      <div><input type="text" id="input-4" placeholder="Field 4"></div>
      <div><input type="checkbox" id="check-5"><label for="check-5">Check 5</label></div>
      <div><input type="checkbox" id="check-6"><label for="check-6">Check 6</label></div>
      <div><input type="checkbox" id="check-7"><label for="check-7">Check 7</label></div>
      <div><input type="checkbox" id="promo-notifications"><label for="promo-notifications">Promo Notifications Target</label></div>
      <div><select id="select-9"><option value="1">Opt 1</option><option value="2">Opt 2</option></select></div>
      <div><select id="select-10"><option value="1">Opt 1</option></select></div>
      <div><select id="report-format"><option value="PDF">PDF</option><option value="CSV">CSV</option></select></div>
      <div><input type="text" id="input-12" placeholder="Field 12"></div>
      <div><input type="text" id="input-13" placeholder="Field 13"></div>
      <div><input type="text" id="input-14" placeholder="Field 14"></div>
      <div><input type="checkbox" id="check-15"><label for="check-15">Check 15</label></div>
      <div><input type="checkbox" id="check-16"><label for="check-16">Check 16</label></div>
      <div><input type="checkbox" id="check-17"><label for="check-17">Check 17</label></div>
      <div><input type="checkbox" id="check-18"><label for="check-18">Check 18</label></div>
      <div><select id="select-19"><option value="1">Opt 1</option></select></div>
      <div><select id="select-20"><option value="1">Opt 1</option></select></div>
      <div><input type="text" id="input-21" placeholder="Field 21"></div>
      <div><input type="text" id="input-22" placeholder="Field 22"></div>
      <div><input type="text" id="input-23" placeholder="Field 23"></div>
      <div><input type="checkbox" id="check-24"><label for="check-24">Check 24</label></div>
      <div><input type="checkbox" id="check-25"><label for="check-25">Check 25</label></div>
      <div><input type="checkbox" id="check-26"><label for="check-26">Check 26</label></div>
      <div><button type="button" id="btn-27">Button 27</button></div>
      <div><button type="button" id="btn-28">Button 28</button></div>
      <div><button type="button" id="btn-29">Button 29</button></div>
      <div><button type="submit" id="save-settings-btn">Save Changes</button></div>
    </form>
  </div>
</body>
</html>
